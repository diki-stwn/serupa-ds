<!-- InText -->
<p style="margin:0">Press <kbd class="dk-kbd dk-kbd--size-md dk-kbd--single" data-component="kbd" data-size="md">
<kbd class="dk-kbd__key">/</kbd>
</kbd> to search, or <kbd class="dk-kbd dk-kbd--size-sm" data-component="kbd" data-size="sm">
<kbd class="dk-kbd__key" title="Control">
<span aria-hidden="true">Ctrl</span>
<span data-component="visually-hidden" class="dk-visually-hidden">Control</span>
</kbd>
<span class="dk-kbd__plus" aria-hidden="true">+</span>
<kbd class="dk-kbd__key">Shift</kbd>
<span class="dk-kbd__plus" aria-hidden="true">+</span>
<kbd class="dk-kbd__key">P</kbd>
</kbd> for commands.</p>

<!-- LongKeys -->
<p style="margin:0;width:200px">Press <kbd class="dk-kbd dk-kbd--size-md" data-component="kbd" data-size="md">
<kbd class="dk-kbd__key" title="Control">
<span aria-hidden="true">Ctrl</span>
<span data-component="visually-hidden" class="dk-visually-hidden">Control</span>
</kbd>
<span class="dk-kbd__plus" aria-hidden="true">+</span>
<kbd class="dk-kbd__key">Shift</kbd>
<span class="dk-kbd__plus" aria-hidden="true">+</span>
<kbd class="dk-kbd__key">Alt</kbd>
<span class="dk-kbd__plus" aria-hidden="true">+</span>
<kbd class="dk-kbd__key">P</kbd>
</kbd> to open every command, or <kbd class="dk-kbd dk-kbd--size-md dk-kbd--single" data-component="kbd" data-size="md">
<kbd class="dk-kbd__key">Page Down</kbd>
</kbd> to move on.</p>
