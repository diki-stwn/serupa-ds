<!-- Playground -->
<div role="group" aria-label="Clipboard" data-component="button-group" data-orientation="horizontal" class="dk-button-group dk-button-group--attached">
<button data-component="button" data-variant="outline" data-size="md" type="button" class="dk-btn dk-btn--outline dk-btn--size-md dk-btn--icon-left">
<span class="dk-btn__ripples" aria-hidden="true">
</span>
<span class="dk-btn__icon dk-btn__icon--left" aria-hidden="true">
<span aria-hidden="true" data-icon="content_copy" class="dk-icon">
</span>
</span>
<span class="dk-btn__label">Copy</span>
</button>
<button data-component="button" data-variant="outline" data-size="md" type="button" class="dk-btn dk-btn--outline dk-btn--size-md dk-btn--icon-left">
<span class="dk-btn__ripples" aria-hidden="true">
</span>
<span class="dk-btn__icon dk-btn__icon--left" aria-hidden="true">
<span aria-hidden="true" data-icon="content_cut" class="dk-icon">
</span>
</span>
<span class="dk-btn__label">Cut</span>
</button>
<button data-component="button" data-variant="outline" data-size="md" type="button" class="dk-btn dk-btn--outline dk-btn--size-md dk-btn--icon-left">
<span class="dk-btn__ripples" aria-hidden="true">
</span>
<span class="dk-btn__icon dk-btn__icon--left" aria-hidden="true">
<span aria-hidden="true" data-icon="content_paste" class="dk-icon">
</span>
</span>
<span class="dk-btn__label">Paste</span>
</button>
</div>

<!-- Spaced -->
<div role="group" data-component="button-group" data-orientation="horizontal" class="dk-button-group">
<button data-component="button" data-variant="outline" data-size="md" type="button" class="dk-btn dk-btn--outline dk-btn--size-md">
<span class="dk-btn__ripples" aria-hidden="true">
</span>
<span class="dk-btn__label">Cancel</span>
</button>
<button data-component="button" data-variant="primary" data-size="md" type="button" class="dk-btn dk-btn--primary dk-btn--size-md">
<span class="dk-btn__ripples" aria-hidden="true">
</span>
<span class="dk-btn__label">Save</span>
</button>
</div>

<!-- SplitButton -->
<div role="group" aria-label="Publish" data-component="button-group" data-orientation="horizontal" class="dk-button-group dk-button-group--attached">
<button data-component="button" data-variant="primary" data-size="md" type="button" class="dk-btn dk-btn--primary dk-btn--size-md">
<span class="dk-btn__ripples" aria-hidden="true">
</span>
<span class="dk-btn__label">Publish</span>
</button>
<button id="dk-menu_R_2_-button" aria-haspopup="menu" aria-expanded="false" aria-label="More publish options" data-shape="square" title="More publish options" data-component="button" data-variant="primary" data-size="md" data-icon-only="" type="button" class="dk-btn dk-btn--primary dk-btn--size-md dk-btn--icon-only dk-icon-btn">
<span class="dk-btn__ripples" aria-hidden="true">
</span>
<span class="dk-btn__icon dk-btn__icon--only" aria-hidden="true">
<span aria-hidden="true" data-icon="expand_more" class="dk-icon">
</span>
</span>
</button>
<div id="dk-menu_R_2_" role="menu" tabindex="-1" popover="manual" hidden="" aria-labelledby="dk-menu_R_2_-button" class="dk-menu" data-component="menu" data-state="closed">
</div>
</div>

<!-- Vertical -->
<div role="group" aria-label="Zoom" data-component="button-group" data-orientation="vertical" class="dk-button-group dk-button-group--vertical dk-button-group--attached">
<button aria-label="Zoom in" data-shape="square" title="Zoom in" data-component="button" data-variant="outline" data-size="md" data-icon-only="" type="button" class="dk-btn dk-btn--outline dk-btn--size-md dk-btn--icon-only dk-icon-btn">
<span class="dk-btn__ripples" aria-hidden="true">
</span>
<span class="dk-btn__icon dk-btn__icon--only" aria-hidden="true">
<span aria-hidden="true" data-icon="add" class="dk-icon">
</span>
</span>
</button>
<button aria-label="Zoom out" data-shape="square" title="Zoom out" data-component="button" data-variant="outline" data-size="md" data-icon-only="" type="button" class="dk-btn dk-btn--outline dk-btn--size-md dk-btn--icon-only dk-icon-btn">
<span class="dk-btn__ripples" aria-hidden="true">
</span>
<span class="dk-btn__icon dk-btn__icon--only" aria-hidden="true">
<span aria-hidden="true" data-icon="remove" class="dk-icon">
</span>
</span>
</button>
</div>
