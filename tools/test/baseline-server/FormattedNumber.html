<!-- Formats -->
<dl style="display:grid;gap:var(--spacing-1);margin:0;max-width:20rem">
<div style="display:flex;justify-content:space-between;gap:var(--spacing-6)">
<dt>Decimal</dt>
<dd style="margin:0">
<data value="1234.5" class="dk-formatted-number" data-component="formatted-number" data-format="decimal">1,234.5</data>
</dd>
</div>
<div style="display:flex;justify-content:space-between;gap:var(--spacing-6)">
<dt>Compact</dt>
<dd style="margin:0">
<data value="1234567" title="1,234,567" class="dk-formatted-number" data-component="formatted-number" data-format="compact">1.2M</data>
</dd>
</div>
<div style="display:flex;justify-content:space-between;gap:var(--spacing-6)">
<dt>Percent</dt>
<dd style="margin:0">
<data value="0.456" class="dk-formatted-number" data-component="formatted-number" data-format="percent">46%</data>
</dd>
</div>
<div style="display:flex;justify-content:space-between;gap:var(--spacing-6)">
<dt>Currency</dt>
<dd style="margin:0">
<data value="150000" class="dk-formatted-number" data-component="formatted-number" data-format="currency">IDR 150,000</data>
</dd>
</div>
<div style="display:flex;justify-content:space-between;gap:var(--spacing-6)">
<dt>Bytes</dt>
<dd style="margin:0">
<data value="1572864" class="dk-formatted-number" data-component="formatted-number" data-format="bytes">1.5 MB</data>
</dd>
</div>
<div style="display:flex;justify-content:space-between;gap:var(--spacing-6)">
<dt>Unit</dt>
<dd style="margin:0">
<data value="50" class="dk-formatted-number" data-component="formatted-number" data-format="unit">50 km/h</data>
</dd>
</div>
<div style="display:flex;justify-content:space-between;gap:var(--spacing-6)">
<dt>Change</dt>
<dd style="margin:0">
<data value="0.031" class="dk-formatted-number" data-component="formatted-number" data-format="percent">+3.1%</data>
</dd>
</div>
</dl>

<!-- Locales -->
<ul style="display:grid;gap:var(--spacing-1);margin:0;padding-inline-start:var(--spacing-5)">
<li style="display:flex;justify-content:space-between;gap:var(--spacing-6)">
<span>en-US</span>
<data value="1234567.89" class="dk-formatted-number" data-component="formatted-number" data-format="decimal">1,234,567.89</data>
</li>
<li style="display:flex;justify-content:space-between;gap:var(--spacing-6)">
<span>id-ID</span>
<data lang="id-ID" value="1234567.89" class="dk-formatted-number" data-component="formatted-number" data-format="decimal">1.234.567,89</data>
</li>
<li style="display:flex;justify-content:space-between;gap:var(--spacing-6)">
<span>de-DE</span>
<data lang="de-DE" value="1234567.89" class="dk-formatted-number" data-component="formatted-number" data-format="decimal">1.234.567,89</data>
</li>
<li style="display:flex;justify-content:space-between;gap:var(--spacing-6)">
<span>fr-FR</span>
<data lang="fr-FR" value="1234567.89" class="dk-formatted-number" data-component="formatted-number" data-format="decimal">1 234 567,89</data>
</li>
<li style="display:flex;justify-content:space-between;gap:var(--spacing-6)">
<span>ar-EG</span>
<data lang="ar-EG" value="1234567.89" class="dk-formatted-number" data-component="formatted-number" data-format="decimal">١٬٢٣٤٬٥٦٧٫٨٩</data>
</li>
<li style="display:flex;justify-content:space-between;gap:var(--spacing-6)">
<span>hi-IN</span>
<data lang="hi-IN" value="1234567.89" class="dk-formatted-number" data-component="formatted-number" data-format="decimal">12,34,567.89</data>
</li>
</ul>
