name: CI

on:
  pull_request:
  # The merge queue tests each pull request merged onto main (and the ones queued ahead of it) before it lands.
  merge_group:
  push:
    branches: [main]
  # The Release workflow starts this on the Release pull request's branch: GitHub doesn't run CI for a pull
  # request that a workflow opened or updated, and main needs these checks to merge it. The Update baselines
  # workflow starts it too, after committing new pictures, with "since" set to where the pull request started, so
  # that run tests only what the pull request changes, as its own run would.
  workflow_dispatch:
    inputs:
      since:
        description: Test only the components changed since this commit (empty tests everything)
        required: false
        default: ''

# A new push to a pull request cancels the run for the push before it, which nothing would read; runs on main
# all finish, so every commit there keeps its result.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only reads the repository, so a bad test dependency can't push or change pull requests.
permissions:
  contents: read

jobs:
  # Builds the package and Storybook once; every test job downloads them instead of building its own.
  build:
    name: build
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The commit it built. A pull request's merge commit is made again whenever main moves, so a test job that checked
    # out the pull request by name could get a newer one than the build it downloads (reproducible.mjs then fails).
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: npm ci would otherwise run the "prepare" build too, and the next step builds.
      - run: npm ci --ignore-scripts
      - name: tokens.css is generated from tokens.json
        run: node tools/tokens/build.mjs --check
      - name: Build the package
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            dist/
            storybook-static/
          retention-days: 3
          if-no-files-found: error

  # The checks that need neither the build nor a browser, beside the build so they don't wait for it.
  static:
    name: types and lint
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      # Every installed package's registry signature and provenance attestation checks out, so a tampered
      # tarball in the lockfile or the cache fails here.
      - name: Dependencies are signed by the registry
        run: npm audit signatures
      - name: Every file carries the same version
        run: node tools/release.mjs --check
      - name: Type check
        run: npm run typecheck
      - name: Lint (ESLint and Stylelint)
        run: npm run lint

  suite:
    # The suite runs as parallel jobs, one per group (tools/test/run.mjs --group), so a run takes as long as
    # its slowest group instead of all of them in a row.
    name: suite (${{ matrix.group }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: build
    strategy:
      # On a pull request, the first failing group cancels the others, so the runners go to the next run sooner
      # (the failure is already enough to fix). Main runs every group to the end, so each failure there shows.
      fail-fast: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.since != '') }}
      matrix:
        # The visual snapshots and Storybook's check (every preview or story in six themes) are the slowest, so
        # they run as shards (SERUPA_SHARD).
        include:
          - { group: checks }
          - { group: components }
          - { group: visual, shard: 1/4 }
          - { group: visual, shard: 2/4 }
          - { group: visual, shard: 3/4 }
          - { group: visual, shard: 4/4 }
          - { group: storybook, shard: 1/4 }
          - { group: storybook, shard: 2/4 }
          - { group: storybook, shard: 3/4 }
          - { group: storybook, shard: 4/4 }
    # Pinned so font rendering, and with it the visual snapshots, stays the same between runs.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit the build job built, not the pull request's merge commit as it is now.
          ref: ${{ needs.build.outputs.sha }}
          # A pull request's merge commit and the base it merges into (HEAD^1), to see what it changes; a run started
          # with "since" needs the history back to that commit.
          fetch-depth: ${{ github.event_name == 'workflow_dispatch' && inputs.since != '' && '0' || '2' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - uses: ./.github/actions/playwright
      - name: Test suite
        shell: bash
        env:
          SERUPA_SHARD: ${{ matrix.shard }}
          # The component tests also measure coverage (coverage/, summed up on the run's summary page).
          SERUPA_COVERAGE: ${{ matrix.group == 'components' && '1' || '' }}
          # On a pull request, a change inside component folders tests only those components and the ones that use
          # them (run.mjs --since); main runs everything after the merge.
          SINCE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || inputs.since }}
        run: |
          set -o pipefail
          node tools/test/run.mjs --group ${{ matrix.group }} ${SINCE:+--since "$SINCE"} 2>&1 | tee test-output.txt
      - name: Coverage summary
        if: always() && matrix.group == 'components'
        run: node tools/test/vitest/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Show failures on the pull request
        if: failure()
        shell: bash
        run: |
          # One annotation listing the failing tests, so they show on the PR without opening the log.
          # Which groups failed first, then the failing tests (an annotation holds a limited amount of text).
          msg=$( { sed -n '/━━ Summary ━━/,$p' test-output.txt | grep '^FAIL'; echo; grep -E '^(CHANGED|NEW|MISSING|NO EFFECT) ' test-output.txt | head -20; grep -E -A1 '^FAIL' test-output.txt | grep -v '^--$' | head -60; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Failing tests (${{ matrix.group }})::${msg}"
          { echo '## Failing tests (${{ matrix.group }})'; echo '```'; grep -E -A1 '^FAIL|^(PASS|FAIL)  [A-Z]' test-output.txt | grep -v '^--$' | head -150; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-${{ matrix.group }}${{ matrix.shard && format('-{0}', strategy.job-index) || '' }}
          path: |
            test-output.txt
            .test-tmp/
            tools/test/baseline-visual/**/*.actual.png
          if-no-files-found: ignore

  # On a pull request, the first failed job stops the whole run: it can't pass any more, so its runners go to the next
  # pull request. The suite's fail-fast stops the suite's own jobs; these stop everything else (types and lint while
  # the suite fails, or the other way round). One per job, since each waits only on its own. Main runs everything.
  stop-build:
    needs: build
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID"

  stop-static:
    needs: static
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID"

  stop-suite:
    needs: suite
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID"

  # The package installed into an empty project on the oldest Node that package.json allows, and the one between
  # (tools/test/consumer.mjs): the repository builds on Node 26 (.nvmrc), so nothing else runs 22 or 24. No npm ci:
  # the repository's dependencies ask for Node 26, and the check needs only Node and the build.
  consumer:
    name: consumer (Node ${{ matrix.node }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
      - run: node tools/test/consumer.mjs

  # One check that passes only when every group passed, under the name the single job used to have.
  test:
    needs: [build, static, suite, consumer]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: github.head_ref != 'changeset-release/main'
        run: test "${{ needs.build.result }}" = success && test "${{ needs.static.result }}" = success && test "${{ needs.suite.result }}" = success && test "${{ needs.consumer.result }}" = success
