name: Figma variables

# Sends the tokens to a Figma file as variables (tools/tokens/figma-variables.mjs) when they change on main, or when
# run from the Actions tab. It needs two repository secrets: FIGMA_TOKEN, a personal access token with the
# file_variables:read and file_variables:write scopes, and FIGMA_FILE, the file's key (figma.com/design/<key>/…).
# Figma's Variables REST API needs an Enterprise plan. Without the secrets the job says so and passes.
on:
  push:
    branches: [main]
    paths: ['tokens/**', 'tokens.json', 'design-tokens/**', 'tools/tokens/figma-variables.mjs']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: figma-variables
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node tools/tokens/figma-variables.mjs --send
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE: ${{ secrets.FIGMA_FILE }}
