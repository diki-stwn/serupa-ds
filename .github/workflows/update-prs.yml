name: Update pull requests

# Two pull requests can each pass on their own and break main once both land (each raised a size budget to just fit,
# say). A pull request's checks were run on top of main as it was then, so after every merge to main this brings main
# into each open pull request that has auto-merge on and starts CI again on the result: the new head commit has no
# checks yet, so auto-merge waits until the pull request passes on top of what just landed. (GitHub's merge queue
# does this, but only for repositories owned by an organization.) With "Require branches to be up to date before
# merging" on in main's protection rule, a pull request that finishes in the moment before its update can't land
# either.
on:
  push:
    branches: [main]

# A newer push to main replaces this run: its updates bring in that commit too.
concurrency:
  group: update-prs
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Bring main into each pull request that will merge itself, and test it again
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ github.sha }}
        # Branch names are the pull request authors' text: they reach the shell as variables, never pasted into the
        # script. Only this repository's branches (a fork's can't take a push from here), not drafts, and not the
        # Release pull request, which its own workflow keeps up to date.
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --base main --state open --limit 50 \
            --json number,headRefName,headRefOid,isDraft,isCrossRepository,autoMergeRequest \
            --jq '.[] | select(.autoMergeRequest != null and (.isDraft | not) and (.isCrossRepository | not) and (.headRefName | startswith("changeset-release/") | not)) | [.number, .headRefName, .headRefOid] | @tsv' |
          while IFS=$'\t' read -r number branch head; do
            # Already has main, or can't take it (a conflict): GitHub refuses, and the pull request is left as it is.
            if ! gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$number/update-branch" -f expected_head_sha="$head" --silent 2>/dev/null; then
              echo "#$number: left as it is (already has main, or main doesn't merge in cleanly)"; continue
            fi
            # The merge commit lands a moment later: wait for it, so CI runs on it and not on the old head.
            new="$head"
            for _ in $(seq 30); do
              new=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
              [ "$new" != "$head" ] && break
              sleep 2
            done
            if [ "$new" = "$head" ]; then echo "#$number: main didn't land in time; the next push to main tries again"; continue; fi
            # A push made with the workflow's token starts no workflows, so start CI and the changeset check, as the
            # Update baselines workflow does. "since" is main: the run tests what the pull request changes.
            gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" -f since="$MAIN"
            gh workflow run changeset.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
            echo "#$number: main merged in ($new), CI started"
          done
