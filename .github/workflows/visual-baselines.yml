name: Update baselines

# Screenshots and text measurements differ slightly between machines (font smoothing, and the
# system fonts behind serif and mono), so the visual and utility baselines are made on the same
# runner CI uses. Add the "update-visual-baselines" label to a pull request to re-render them on
# its branch; the new baselines are committed back to the branch. Review them in
# the pull request's Files changed tab before merging.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    if: github.event.label.name == 'update-visual-baselines' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/playwright
      - name: Render the baselines
        run: |
          npm run build
          node tools/test/visual.mjs --update
          node tools/test/utilities.mjs --update
      - name: Commit them to the branch
        run: |
          git add tools/test/baseline-visual tools/test/baseline-utilities.json
          if git diff --cached --quiet; then echo "Baselines unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update test baselines on the CI runner"
          git push
          # A push made with the workflow's token starts no workflows, so start CI on the branch: its checks
          # land on the new head commit, which the pull request's required checks look at.
          # The branch name is the PR author's text: it reaches the shell as a variable, never pasted into the script.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
      - name: Remove the label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label update-visual-baselines
