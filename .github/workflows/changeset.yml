name: Changeset

# Every pull request that changes what a project installs carries a changeset (.changeset/README.md):
# tools/changeset-check.mjs says which files need one. A pull request that ships nothing new despite touching
# those files (a comment, a refactor with identical output) takes the "no-changeset" label. Its own workflow, so
# adding or removing the label re-runs this check alone, not the whole of CI.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue needs this check to pass too; the pull request's own run already checked its changeset.
  merge_group:
  # The Release and Update baselines workflows start it on a branch they pushed to (a push made with the
  # workflow's token starts no workflows), so the "changeset" check, which main requires, lands on that head
  # commit. Like the merge queue it only reports: the Release pull request is the one that removes the
  # changesets, and a commit of new pictures ships nothing. The pull request's own run checked the rest.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changeset:
    name: changeset
    runs-on: ubuntu-24.04
    # The Release pull request is the one that removes the changesets.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changeset') && !startsWith(github.head_ref, 'changeset-release/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: A changeset for every change to what the package ships
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node tools/changeset-check.mjs "$BASE_SHA"
