name: Cross-browser

# Every night, the component suites run in Firefox and WebKit (Safari's engine) as well as Chromium.
# It doesn't block pull requests: a red run here is a browser difference to look at, not a broken main.
# It also runs on a pull request that changes this file, and on demand from the Actions tab.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/cross-browser.yml']

# Read the code; nothing here writes to the repository.
permissions:
  contents: read

jobs:
  components:
    name: components (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build the package
        run: npm run build
      - name: Component suites in ${{ matrix.browser }}
        shell: bash
        run: |
          set -o pipefail
          node tools/test/run.mjs --browser ${{ matrix.browser }} --group components 2>&1 | tee test-output.txt
      - name: List the failures
        if: failure()
        shell: bash
        run: |
          { echo '## Failing in ${{ matrix.browser }}'; echo '```'; grep -E -A1 '^FAIL' test-output.txt | grep -v '^--$' | head -150; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-${{ matrix.browser }}
          path: test-output.txt
          if-no-files-found: ignore
