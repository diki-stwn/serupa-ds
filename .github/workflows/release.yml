name: Release

# On main: while changesets are waiting (.changeset/*.md), keeps a "Release" pull request open that turns
# them into the next version (npm run version-packages). Once that pull request is merged, tags the version
# and makes a GitHub release with the package attached (npm run release).
# It runs only after CI has passed on a push to main, and works on the commit CI tested, so a red main
# can't be tagged or released. If main has moved on since, it stops: the newer commit's own run takes over,
# so two merges in a row can't leave a version behind.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  actions: write   # to start CI on the Release pull request

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: head
        run: |
          main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main" = "$HEAD_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"
          else echo "main is at $main now, not $HEAD_SHA: its own run releases it."; fi
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - if: steps.head.outputs.current
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: npm ci would otherwise run the "prepare" build, and npm run release builds again.
      - if: steps.head.outputs.current
        run: npm ci --ignore-scripts
      # Releases the version in package.json if it has no tag yet, before new changesets turn into the next
      # Release pull request. Otherwise a merge that lands right after a Release pull request would skip
      # straight to the next version and that one would never be released. Does nothing once it's tagged.
      - if: steps.head.outputs.current
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pinned to a commit: this step runs with write access to the repository, so a moved tag can't change it.
      - if: steps.head.outputs.current
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: 'Release: next version'
          commit-message: 'Release: next version'
          # npm run release makes the tag and the GitHub release itself.
          create-github-releases: false
          push-git-tags: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A pull request this workflow opens or updates gets no CI of its own, so start CI and the changeset check on its branch;
      # the checks land on its head commit, which is what main's required checks look at.
      - if: steps.head.outputs.current && steps.changesets.outputs.pr-number
        run: |
          gh workflow run ci.yml --ref changeset-release/main
          gh workflow run changeset.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
