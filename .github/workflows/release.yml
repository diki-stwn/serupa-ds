name: Release

# On main: while changesets are waiting (.changeset/*.md), keeps a "Release" pull request open that turns
# them into the next version (npm run version-packages). Once that pull request is merged, tags the version
# and makes a GitHub release with the package attached (npm run release).
# It runs only after CI has passed on a push to main, and works on the commit CI tested, so a red main
# can't be tagged or released. If main has moved on since, it still releases a version that has no tag yet
# (npm run release builds the commit that brought it), but leaves the Release pull request to the newer
# commit's own run. The Release pull request merges itself once its required checks pass.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  actions: write   # to start CI on the Release pull request

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.BOT_TOKEN }}
          fetch-depth: 0
      - id: head
        run: |
          main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$main" = "$HEAD_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"
          else echo "main is at $main now, not $HEAD_SHA: its own run makes the Release pull request."; fi
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: npm ci would otherwise run the "prepare" build, and npm run release builds again.
      - run: npm ci --ignore-scripts
      # Releases the version in package.json if it has no tag yet, before new changesets turn into the next
      # Release pull request. Otherwise a merge that lands right after a Release pull request would skip
      # straight to the next version and that one would never be released. Does nothing once it's tagged.
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pinned to a commit: this step runs with write access to the repository, so a moved tag can't change it.
      - if: steps.head.outputs.current
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: npm run version-packages
          github-token: ${{ secrets.BOT_TOKEN }}
          publish-script: npm run release
          pr-title: 'Release: next version'
          commit-message: 'Release: next version'
          # npm run release makes the tag and the GitHub release itself.
          create-github-releases: false
          push-git-tags: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The Release pull request merges itself once its required checks pass.
      - if: steps.changesets.outputs.pullRequestNumber
        run: gh pr merge --auto --merge "$PR"
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          PR: ${{ steps.changesets.outputs.pullRequestNumber }}
