<!doctype html>
<html>
<head><meta charset="utf-8"><title>TreeView — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.TreeView, { 'aria-label': 'Files', items: [{ id: 'src', label: 'src', children: [{ id: 'a', label: 'index.ts' }, { id: 'b', label: 'Button.tsx' }] }, { id: 'r', label: 'README.md' }], defaultExpanded: ['src'], defaultValue: ['a'] }));
</script>
</body>
</html>
