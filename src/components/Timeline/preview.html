<!doctype html>
<html>
<head><meta charset="utf-8"><title>Timeline — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.Timeline, { 'aria-label': 'Order history' },
    h(T.TimelineItem, { title: 'Order placed', time: '12 Mar, 09:14', dateTime: '2026-03-12T09:14', status: 'primary', icon: 'shopping_cart' }, 'Two items, paid by card.'),
    h(T.TimelineItem, { title: 'Payment confirmed', time: '12 Mar, 09:15', status: 'success' }),
    h(T.TimelineItem, { title: 'Out for delivery', time: '15 Mar, 08:02' })));
</script>
</body>
</html>
