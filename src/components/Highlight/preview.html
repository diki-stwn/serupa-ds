<!doctype html>
<html>
<head><meta charset="utf-8"><title>Highlight — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('ul', { style: { margin: 0, display: 'grid', gap: 4 } },
    h('li', null, h(T.Highlight, { query: 'lodz' }, 'Łódź, Poland')),
    h('li', null, h(T.Highlight, { query: 'strasse' }, 'Straße des 17. Juni')),
    h('li', null, h(T.Highlight, { query: 'york new', words: true }, 'New York, United States'))));
</script>
</body>
</html>
