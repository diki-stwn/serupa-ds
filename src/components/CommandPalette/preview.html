<!doctype html>
<html>
<head><meta charset="utf-8"><title>CommandPalette — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.CommandPalette, { defaultOpen: true, commands: [{ id: 'home', label: 'Home', group: 'Pages' }, { id: 'settings', label: 'Settings', group: 'Pages' }, { id: 'new', label: 'New project', group: 'Actions', shortcut: ['mod', 'N'] }] }));
</script>
</body>
</html>
