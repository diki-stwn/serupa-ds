<!doctype html>
<html>
<head><meta charset="utf-8"><title>HoverCard — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { padding: '8px 0 240px' } }, 'Reviewed by ',
      h(T.HoverCard, { open: true, onOpenChange: function () {}, placement: 'bottom-start', trigger: h(T.Link, { href: '#dewi' }, '@dewi') },
        h('div', { style: { display: 'flex', flexDirection: 'column', gap: '8px' } },
          h('strong', null, 'Dewi Lestari'), h('span', null, 'Design lead, Payments'), h(T.Link, { href: '#projects' }, "See Dewi's projects"))),
      ' on Monday.')
  );
</script>
</body>
</html>
