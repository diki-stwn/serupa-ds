<!doctype html>
<html>
<head><meta charset="utf-8"><title>ToggleGroup — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.ToggleGroup, { 'aria-label': 'Text alignment', defaultValue: ['left'] }, h(T.ToggleButton, { value: 'left' }, 'Left'), h(T.ToggleButton, { value: 'center' }, 'Center'), h(T.ToggleButton, { value: 'right' }, 'Right')));
</script>
</body>
</html>
