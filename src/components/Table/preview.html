<!doctype html>
<html>
<head><meta charset="utf-8"><title>Table — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var D = window.Serupa, h = React.createElement;
  var rows = [['Ada Lovelace', 'Admin', '1,204'], ['Grace Hopper', 'Editor', '318'], ['Linus Torvalds', 'Viewer', '0']];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(D.Table, { caption: 'Team members', hideCaption: true },
      h(D.TableHead, null, h(D.TableRow, null, h(D.TableHeaderCell, null, 'Name'), h(D.TableHeaderCell, null, 'Role'), h(D.TableHeaderCell, { align: 'end', sort: 'descending' }, 'Calls'))),
      h(D.TableBody, null, rows.map(function (r, i) { return h(D.TableRow, { key: r[0], selected: i === 1 }, h(D.TableCell, null, r[0]), h(D.TableCell, null, h(D.Text, { as: 'span', tone: 'muted' }, r[1])), h(D.TableCell, { align: 'end' }, r[2])); })))
  );
</script>
</body>
</html>
