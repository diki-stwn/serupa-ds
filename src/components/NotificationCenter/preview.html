<!doctype html>
<html>
<head><meta charset="utf-8"><title>NotificationCenter — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.NotificationCenter, { defaultOpen: true, items: [{ id: "a", title: "Payment failed", tone: "danger" }, { id: "b", title: "Invoice sent", tone: "success", read: true }] }));
</script>
</body>
</html>
