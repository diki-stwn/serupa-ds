<!doctype html>
<html>
<head><meta charset="utf-8"><title>KeyboardShortcuts — preview</title>
<style>
  body { margin: 0; padding: 16px; background: var(--surface); color: var(--text); font-family: var(--font-sans); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var T = window.Serupa, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(T.KeyboardShortcuts, { defaultOpen: true, shortcuts: [{ keys: ["mod", "K"], description: "Search" }, { keys: ["C"], description: "New message" }] }));
</script>
</body>
</html>
